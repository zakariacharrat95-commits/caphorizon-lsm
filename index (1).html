<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap Horizon LSM | Logistics, Supply Chain & Maritime | Le Havre</title>
<meta name="description" content="Cap Horizon LSM supports ports, airports, logistics platforms and maritime players from Le Havre, across France and internationally.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%230B1B2E'/%3E%3Cpath d='M100 30 L118 86 L108 86 L100 62 L92 86 L82 86Z' fill='%23D9B56A'/%3E%3Crect x='34' y='110' width='132' height='7' fill='%23D9B56A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1B2E; --steel:#46586D; --mist:#EEF2F6; --paper:#FFFFFF; --gold:#A77A2E; --gold-soft:#D9B56A;
  --bg:var(--paper); --surface:var(--mist); --text:var(--ink); --muted:var(--steel); --accent:var(--gold); --line:#D9DFE6;
  --sea:#E4ECF4; --land:#C9D3DE; --route:#A77A2E;
  --fr-b:#002395; --fr-w:#E9ECEF; --fr-r:#ED2939;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08141F;--surface:#0E2032;--text:#EEF2F6;--muted:#A9B7C7;--accent:#D9B56A;--line:#20364D;--fr-w:#F4F4F4;--sea:#0C1C2C;--land:#1D3349;--route:#D9B56A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08141F;--surface:#0E2032;--text:#EEF2F6;--muted:#A9B7C7;--accent:#D9B56A;--line:#20364D;--fr-w:#F4F4F4;--sea:#0C1C2C;--land:#1D3349;--route:#D9B56A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 "Source Sans 3","Segoe UI",Arial,sans-serif}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{width:min(1140px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3,h4{font-family:Saira,"Segoe UI",Arial,sans-serif;line-height:1.15;margin:0}
h2{font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:600}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
.fr{display:inline-flex;height:6px;width:66px;border-radius:2px;overflow:hidden;vertical-align:middle}
.fr i{flex:1}.fr i:nth-child(1){background:var(--fr-b)}.fr i:nth-child(2){background:var(--fr-w)}.fr i:nth-child(3){background:var(--fr-r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:0 1.25rem;border-radius:999px;font:600 1rem "Source Sans 3",Arial,sans-serif;text-decoration:none;border:1.5px solid var(--text);color:var(--text);background:transparent;cursor:pointer}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme="dark"] .btn.solid{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.solid{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--ink)}}
.btn svg{width:20px;height:20px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:70px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;flex:none}
.brand svg{width:40px;height:40px}
.brand img{height:20px;width:auto}
.wm-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm-light{display:none}:root:not([data-theme="light"]) .wm-dark{display:block}}
:root[data-theme="dark"] .wm-light{display:none}:root[data-theme="dark"] .wm-dark{display:block}
.menu{display:flex;gap:.2rem;align-items:center}
.menu a{text-decoration:none;font-weight:600;font-size:.98rem;color:var(--muted);padding:.55rem .75rem;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
.menu a:hover{color:var(--text)}
.menu a[aria-current="page"]{color:var(--text);background:var(--surface)}
.tools{display:flex;gap:.5rem;align-items:center}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .9rem Saira,Arial,sans-serif;min-height:40px;min-width:44px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
:root[data-theme="dark"] .lang button[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lang button[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink)}}
.burger{display:none;border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:999px;min-height:44px;min-width:44px;cursor:pointer}
@media (max-width:1020px){
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .menu{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:.6rem 1.25rem 1rem}
  .menu.open{display:flex}
}
@media (max-width:480px){.brand img{height:14px}.brand svg{width:34px;height:34px}}

/* views */
.view{display:none}
.view.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding:clamp(3rem,6vw,5rem) 0}
.alt{background:var(--surface)}
.head{display:flex;align-items:end;justify-content:space-between;gap:2rem;flex-wrap:wrap;margin-bottom:2.2rem}
.head p{color:var(--muted);max-width:56ch}

/* hero */
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.7rem);font-weight:700;max-width:17ch}
.lead{margin-top:1.4rem;font-size:1.18rem;color:var(--muted);max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.founder{display:flex;align-items:center;gap:.9rem;margin-top:2.2rem;color:var(--muted);font-size:.98rem}
.founder img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:none}
.founder b{color:var(--text)}
.compass{justify-self:center;width:min(380px,100%)}
.compass svg{width:100%;height:auto;overflow:visible}
.needle{transform-origin:100px 100px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.hint{text-align:center;color:var(--muted);font-size:.92rem;margin-top:.6rem}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.compass{width:min(240px,65%);order:-1}}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.door{display:flex;flex-direction:column;gap:.6rem;padding:1.4rem;border-radius:18px;border:1.5px solid var(--line);text-decoration:none;background:var(--bg);min-height:170px}
.door svg{width:30px;height:30px;color:var(--accent)}
.door p{color:var(--muted);font-size:.98rem}
.door:hover{border-color:var(--accent)}
@media (max-width:900px){.doors{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.doors{grid-template-columns:1fr}}

/* services */
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;border-bottom:2px solid var(--text);padding-bottom:1rem}
.tab{font:600 1rem Saira,Arial,sans-serif;min-height:46px;padding:0 1.1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:.55rem}
.tab svg{width:20px;height:20px;color:var(--accent)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--gold-soft);color:var(--ink);border-color:var(--gold-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--gold-soft);color:var(--ink);border-color:var(--gold-soft)}}
.panel{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:2.2rem;padding-top:2rem}
.panel h3{font-size:1.5rem;margin-bottom:.6rem}
.panel h4{font-size:1rem;margin:0 0 .5rem;color:var(--accent)}
.panel p,.panel li{color:var(--muted)}
.panel ul{margin:0;padding-left:1.1rem}
@media (max-width:860px){.panel{grid-template-columns:1fr;gap:1.4rem}}
.builder{display:grid;grid-template-columns:repeat(3,1fr) 1.25fr;gap:1.4rem;align-items:start}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:600 1.05rem Saira,Arial,sans-serif;margin-bottom:.7rem}
.opts{display:grid;gap:.5rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;min-height:46px;padding:.4rem .9rem;border:1.5px solid var(--line);border-radius:12px;font-weight:600}
.opt input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.result{background:var(--surface);border-radius:18px;padding:1.5rem;border:1px solid var(--line)}
.alt .result{background:var(--bg)}
.result p{margin:.6rem 0;color:var(--muted)}
.result ul{margin:0 0 1.2rem;padding-left:1.1rem;color:var(--muted)}
@media (max-width:980px){.builder{grid-template-columns:1fr 1fr 1fr}.result{grid-column:1/-1}}
@media (max-width:620px){.builder{grid-template-columns:1fr}}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.calc label,.form label{display:grid;gap:.45rem;font-weight:600;font-size:.98rem}
.calc input,.form input,.form textarea,.search{font:400 1.05rem "Source Sans 3",Arial,sans-serif;min-height:50px;padding:.6rem .9rem;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.calc input{font:600 1.25rem Saira,Arial,sans-serif}
.out{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;border-top:2px solid var(--text);padding-top:1.4rem;margin-top:.4rem}
.out b{display:block;font:700 clamp(2rem,4.5vw,3rem) Saira,Arial,sans-serif;color:var(--accent);line-height:1.1}
.out span{color:var(--muted)}
@media (max-width:860px){.calc{grid-template-columns:1fr 1fr}.out{grid-template-columns:1fr}}

/* map */
.mapbox{position:relative;border-radius:22px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.mapbox svg{width:100%;height:auto;display:block}
.land{fill:var(--land)}
.route{fill:none;stroke:var(--route);stroke-width:1.4;stroke-dasharray:4 5;opacity:.75}
.route.hl{stroke-width:2.6;opacity:1;stroke-dasharray:none}
.port{cursor:pointer}
.port circle{fill:var(--bg);stroke:var(--route);stroke-width:2.5}
.port text{font:600 11px Saira,Arial,sans-serif;fill:var(--text);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.home circle{fill:var(--route);stroke:none}
.pulse{fill:none;stroke:var(--route);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(4.5);opacity:0}}
.ship path{fill:var(--text)}
.reach{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.4rem}
.reach div{padding:1.2rem 1.3rem;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.reach b{font:600 1.15rem Saira,Arial,sans-serif;display:block;margin-bottom:.3rem}
.reach p{color:var(--muted)}
.portinfo{margin-top:1rem;color:var(--muted);min-height:1.6em}
.portchips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.portchips button{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;min-height:44px;padding:0 1rem;font:600 .95rem "Source Sans 3",Arial,sans-serif;cursor:pointer}
.portchips button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
@media (max-width:760px){.reach{grid-template-columns:1fr}.port text{display:none}}

/* law */
.lawbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.6rem}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;min-height:44px;padding:0 1rem;font:600 .95rem "Source Sans 3",Arial,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink);border-color:var(--gold-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink);border-color:var(--gold-soft)}}
.search{max-width:340px;margin-left:auto}
@media (max-width:700px){.search{max-width:none;margin-left:0}}
.laws{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.law{border:1.5px solid var(--line);border-radius:16px;background:var(--bg)}
.law button{all:unset;display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1.1rem 1.2rem;cursor:pointer;width:100%;box-sizing:border-box}
.law button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:16px}
.badge{font:600 .8rem Saira,Arial,sans-serif;padding:.25rem .6rem;border-radius:8px;background:var(--surface);color:var(--accent);white-space:nowrap}
.law h3{font-size:1.05rem}
.law small{color:var(--muted);display:block;font-size:.92rem}
.law .more{padding:0 1.2rem 1.2rem;color:var(--muted)}
.law .more b{color:var(--text)}
.law .chev{transition:transform .25s}
.law[open-state="true"] .chev{transform:rotate(180deg)}
.note{margin-top:1.6rem;color:var(--muted);font-size:.95rem}
@media (max-width:820px){.laws{grid-template-columns:1fr}}

/* about */
.profile{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.portrait{position:relative;margin:0}
.portrait img{border-radius:18px;aspect-ratio:4/5;object-fit:cover;object-position:50% 12%;width:100%}
.portrait figcaption{position:absolute;left:1rem;bottom:1rem;background:var(--ink);color:#fff;padding:.55rem .9rem;border-radius:10px;font-size:.92rem;display:flex;gap:.6rem;align-items:center}
.bio{font-size:1.15rem;line-height:1.7;max-width:62ch;margin-top:1.2rem}
.qual{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.8rem 0 0;padding:0;list-style:none}
.qual li{border:1.5px solid var(--line);border-radius:999px;padding:.45rem .95rem;font-weight:600;font-size:.95rem}
.langs{margin-top:1.6rem;color:var(--muted)}.langs b{color:var(--text)}
@media (max-width:860px){.profile{grid-template-columns:1fr}.portrait{max-width:380px}}
.routelist{list-style:none;margin:0;padding:0;position:relative}
.routelist::before{content:"";position:absolute;left:118px;top:.6rem;bottom:.6rem;width:2px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.routelist li{display:grid;grid-template-columns:118px 1fr;gap:2rem;padding:1rem 0;position:relative}
.routelist li::after{content:"";position:absolute;left:112px;top:1.45rem;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.routelist time{font-family:Saira,Arial,sans-serif;font-weight:600;color:var(--accent);padding-top:.15rem}
.routelist h3{font-size:1.1rem}
.routelist p{color:var(--muted);margin-top:.25rem}
@media (max-width:620px){.routelist::before{left:6px}.routelist li{grid-template-columns:1fr;gap:.2rem;padding-left:2rem}.routelist li::after{left:0}}

/* contact */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;padding:1.3rem;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);text-decoration:none;color:var(--text);cursor:pointer;font:inherit;text-align:left;min-height:140px}
.qa svg{width:30px;height:30px;color:var(--accent)}
.qa b{font:600 1.1rem Saira,Arial,sans-serif}
.qa span{color:var(--muted);font-size:.95rem;word-break:break-word}
.qa:hover{border-color:var(--accent)}
@media (max-width:900px){.quick{grid-template-columns:1fr 1fr}}
.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;margin-top:2.5rem;align-items:start}
.form{display:grid;gap:1rem}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form textarea{min-height:150px;resize:vertical}
.status{min-height:1.5em;font-weight:600}
.status.ok{color:#1E7A4C}.status.err{color:#B3261E}
:root[data-theme="dark"] .status.ok{color:#7FD1A8}:root[data-theme="dark"] .status.err{color:#FFB4AB}
.side{padding:1.6rem;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.side p{color:var(--muted);margin-top:.6rem}
@media (max-width:820px){.contact-grid{grid-template-columns:1fr}.form .row{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:1.6rem 0 2.2rem;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.theme{background:none;border:1.5px solid var(--line);color:var(--text);border-radius:999px;min-height:44px;padding:0 .9rem;font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}.needle,.law .chev{transition:none}.pulse{animation:none}}
</style>
</head>
<body>
<header>
  <nav class="wrap nav" aria-label="Main">

/* ---------- static text ---------- */
function applyText(){

/* ---------- services ---------- */
var di=0, tabs=document.getElementById('tabs'), panel=document.getElementById('panel');
function renderTabs(){
  tabs.innerHTML='';
  domains.forEach(function(d,i){
    var b=document.createElement('button'); b.className='tab'; b.type='button'; b.setAttribute('role','tab'); b.innerHTML=svg(d.id)+esc(tx(d.name));
    b.addEventListener('click',function(){di=i; showTab();});
    b.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault(); di=(i+(e.key==='ArrowRight'?1:-1)+domains.length)%domains.length; showTab(); tabs.children[di].focus();}});
    tabs.appendChild(b);
  });
  showTab();
}
function showTab(){
  var d=domains[di];
  [].forEach.call(tabs.children,function(b,j){b.setAttribute('aria-selected',j===di?'true':'false'); b.tabIndex=j===di?0:-1;});
  panel.innerHTML='<div><h3>'+esc(tx(d.name))+'</h3><p>'+esc(tx(d.lead))+'</p><p style="margin-top:.8rem"><b style="color:var(--text)">'+(L==='fr'?'Pour qui :':'Who it is for:')+'</b> '+esc(tx(d.who))+'</p><a class="btn solid" style="margin-top:1.2rem" href="#besoin" data-dom="'+di+'">'+(L==='fr'?'Demander Ce Service':'Request This Service')+'</a></div><div><h4>'+(L==='fr'?'Ce que nous faisons':'What we do')+'</h4><ul>'+li(tx(d.what))+'</ul></div><div><h4>'+(L==='fr'?'Ce que vous recevez':'What you receive')+'</h4><ul>'+li(tx(d.get))+'</ul></div>';
}
panel.addEventListener('click',function(e){
  var a=e.target.closest('[data-dom]'); if(!a) return;
  var m=[[2,0],[0,1],[4,2],[0,3],[0,2]][+a.getAttribute('data-dom')]; sel.sector=m[0]; sel.need=m[1]; renderBuilder();
});
function renderBuilder(){
  document.querySelectorAll('.opts').forEach(function(box){
    var k=box.getAttribute('data-k'); box.innerHTML='';
    choices[k].forEach(function(v,i){
      var l=document.createElement('label'); l.className='opt';
      l.innerHTML='<input type="radio" name="'+k+'" value="'+i+'"'+(sel[k]===i?' checked':'')+'><span>'+esc(tx(v))+'</span>';
      l.querySelector('input').addEventListener('change',function(){sel[k]=i; summary();});
      box.appendChild(l);
    });
  });
  summary();
}
function summary(){
  var s=tx(choices.sector[sel.sector]), n=tx(choices.need[sel.need]), z=tx(choices.zone[sel.zone]);
  document.getElementById('r-text').textContent=(L==='fr'?'Secteur : '+s+'. Besoin : '+n+'. Zone : '+z+'. Voici ce que Cap Horizon LSM vous propose :':'Sector: '+s+'. Need: '+n+'. Area: '+z+'. Here is what Cap Horizon LSM offers you:');
  document.getElementById('r-list').innerHTML=li(tx(deliver[sel.need]));
}
document.getElementById('r-send').addEventListener('click',function(){
  var s=tx(choices.sector[sel.sector]), n=tx(choices.need[sel.need]), z=tx(choices.zone[sel.zone]);
  setTimeout(function(){var m=document.querySelector('#form textarea'); if(m&&!m.value) m.value=(L==='fr'?'Bonjour,\n\nJe souhaite être contacté au sujet de :\n- Secteur : '+s+'\n- Besoin : '+n+'\n- Zone : '+z+'\n\n':'Hello,\n\nI would like to be contacted about:\n- Sector: '+s+'\n- Need: '+n+'\n- Area: '+z+'\n\n');},60);
});
function calc(){
  var g=function(id){return +document.getElementById(id).value;};
  var pal=Math.max(0,g('c-pal')||0), cap=Math.max(1,g('c-cap')||1), fill=Math.min(100,Math.max(10,g('c-fill')||90))/100, days=Math.min(365,Math.max(1,g('c-days')||1));
  var tr=pal>0?Math.ceil(pal/(cap*fill)):0, real=tr?pal/(tr*cap)*100:0, loc=L==='fr'?'fr-FR':'en-GB';
  document.getElementById('o-day').textContent=tr.toLocaleString(loc);
  document.getElementById('o-year').textContent=(tr*days).toLocaleString(loc);
  document.getElementById('o-real').textContent=Math.round(real)+' %';
}
['c-pal','c-cap','c-fill','c-days'].forEach(function(id){document.getElementById(id).addEventListener('input',calc);});

var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, last=0;
function place(sh){var p=paths[sh.k].getPointAtLength(sh.t*sh.len), q=paths[sh.k].getPointAtLength(Math.min(sh.len,sh.t*sh.len+1)); var a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI; sh.el.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+a.toFixed(0)+')');}
function loop(ts){var dt=last?(ts-last)/1000:0; last=ts; if(document.getElementById('v-reach').classList.contains('on')){ships.forEach(function(sh){sh.t=(sh.t+sh.v*dt*(sh.len>400?0.6:1.4))%1; place(sh);});} requestAnimationFrame(loop);}

/* ---------- law ---------- */
function renderLaws(){
  var q=(document.getElementById('lawq').value||'').toLowerCase(), box=document.getElementById('laws'); box.innerHTML='';
  var tag={int:t('f_int'),eu:t('f_eu'),fr:t('f_fr')};
  var list=laws.filter(function(x){
    if(lf!=='all'&&x.r!==lf) return false;
    var hay=[typeof x.n==='string'?x.n:tx(x.n),tx(x.full),tx(x.d),tx(x.w)].join(' ').toLowerCase();
    return !q||hay.indexOf(q)>-1;
  });
  if(!list.length){box.innerHTML='<p class="note">'+esc(t('law_none'))+'</p>'; return;}
  list.forEach(function(x,i){
    var name=typeof x.n==='string'?x.n:tx(x.n), yr=typeof x.y==='string'?x.y:tx(x.y);
    var art=document.createElement('article'); art.className='law';
    var id='lw'+i;
    art.innerHTML='<button type="button" aria-expanded="false" aria-controls="'+id+'"><span class="badge">'+esc(tag[x.r])+'</span><span><h3>'+esc(name)+(yr?' ('+esc(yr)+')':'')+'</h3><small>'+esc(tx(x.full))+'</small></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="more" id="'+id+'" hidden><p>'+esc(tx(x.d))+'</p><p style="margin-top:.5rem"><b>'+esc(t('law_why'))+'</b> '+esc(tx(x.w))+'</p></div>';
    var b=art.querySelector('button'), m=art.querySelector('.more');
    b.addEventListener('click',function(){var o=b.getAttribute('aria-expanded')==='true'; b.setAttribute('aria-expanded',!o); m.hidden=o; art.setAttribute('open-state',!o);});
    box.appendChild(art);
  });
}

/* ---------- contact ---------- */
var toastEl=document.getElementById('toast');
function toast(m){toastEl.textContent=m; toastEl.classList.add('show'); setTimeout(function(){toastEl.classList.remove('show');},1800);}
document.getElementById('copy').addEventListener('click',function(){
  var done=function(){toast(t('copied'));};
  if(navigator.clipboard) navigator.clipboard.writeText(EMAIL_PUBLIC).then(done,function(){prompt('',EMAIL_PUBLIC);}); else prompt('',EMAIL_PUBLIC);
});
document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target, st=document.getElementById('status'), d={name:f.name.value.trim(),company:f.company.value.trim(),email:f.email.value.trim(),phone:f.phone.value.trim(),message:f.message.value.trim(),_subject:'Cap Horizon LSM : '+(f.name.value.trim()||'contact'),_honey:f._honey.value,_template:'table'};
  if(!d.name||!d.email||!d.message||d.email.indexOf('@')<1){st.className='status err'; st.textContent=t('fm_missing'); return;}
  st.className='status'; st.textContent=t('fm_sending');
  fetch('https://formsubmit.co/ajax/'+EMAIL_FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(d)})
   .then(function(r){return r.json();}).then(function(j){
     if(j&&(j.success===true||j.success==='true')){st.className='status ok'; st.textContent=t('fm_ok'); f.reset();}
     else throw 0;
   }).catch(function(){
     st.className='status err'; st.textContent=t('fm_err');
     location.href='mailto:'+EMAIL_PUBLIC+'?subject='+encodeURIComponent(d._subject)+'&body='+encodeURIComponent(d.message+'\n\n'+d.name+(d.company?' – '+d.company:'')+(d.phone?'\n'+d.phone:''));
   });
});

/* ---------- router ---------- */
var views=['home','services','reach','law','about','contact'];
function route(){
  var h=(location.hash||'#home').slice(1), v=views.indexOf(h)>-1?h:(h==='besoin'?'services':'home');
  views.forEach(function(x){document.getElementById('v-'+x).classList.toggle('on',x===v);});
  document.querySelectorAll('#menu a').forEach(function(a){a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+v); if(a.getAttribute('href')==='#'+v) a.setAttribute('aria-current','page');});
  menu.classList.remove('open'); burger.setAttribute('aria-expanded','false');
  if(h==='besoin'){setTimeout(function(){document.getElementById('besoin').scrollIntoView();},30);} else window.scrollTo(0,0);
  if(v==='contact') document.title='Contact | Cap Horizon LSM'; else document.title='Cap Horizon LSM | Logistics, Supply Chain & Maritime | Le Havre';
}
var menu=document.getElementById('menu'), burger=document.getElementById('burger');
burger.addEventListener('click',function(){var o=menu.classList.toggle('open'); burger.setAttribute('aria-expanded',o);});
addEventListener('hashchange',route);

}

applyText(); calc(); route();
})();
